<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="controls">
    <label for="difficulty-select">Difficulty:</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="hint-button">Hint</button>
    <button id="check-solution">Check Solution</button>
    <button id="theme-toggle" type="button" aria-pressed="false">Dark Mode</button>
    <span id="message"></span>
  </div>
  <section id="scoreboard-section">
    <h2>Top 10 Scores</h2>
    <div id="game-stats">
      <span id="current-difficulty">Difficulty: Medium</span>
      <span id="current-hints">Hints used: 0</span>
      <span id="current-time">Time: 0s</span>
    </div>
    <table id="scoreboard-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Time (s)</th>
          <th>Difficulty</th>
          <th>Hints</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
